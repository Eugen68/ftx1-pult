# Автоматическая сборка FTX1-Pult.exe на серверах GitHub.
# Загрузите проект в свой репозиторий GitHub → вкладка Actions → «Build FTX1-Pult.exe» → Run workflow.
# Готовый exe — в разделе Artifacts у завершённой сборки.
name: Build FTX1-Pult.exe
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pyinstaller
      - run: >
          pyinstaller --noconfirm --clean --onefile --windowed --name FTX1-Pult
          --icon web\icon.ico --add-data "web;web" --add-data "server\menu_ftx1.json;."
          --hidden-import pystray._win32 --paths server server\main.py
      - name: Самопроверка exe (библиотеки и файлы)
        shell: pwsh
        run: |
          $p = Start-Process dist\FTX1-Pult.exe -ArgumentList '--selftest','selftest.txt' -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Проверка запуска сервера (симулятор)
        shell: pwsh
        run: |
          '{"open_panel": false, "auto_connect": true}' | Set-Content dist\config.json
          $p = Start-Process dist\FTX1-Pult.exe -ArgumentList '--sim','--background' -PassThru
          Start-Sleep -Seconds 12
          $ping = (Invoke-WebRequest http://127.0.0.1:8080/api/ping -UseBasicParsing).Content
          $panel = (Invoke-WebRequest http://127.0.0.1:8080/panel.html -UseBasicParsing).StatusCode
          $pult = (Invoke-WebRequest http://127.0.0.1:8080/ -UseBasicParsing).StatusCode
          "ping: $ping  panel: $panel  pult: $pult"
          Get-Content dist\ftx1-pult.log
          Stop-Process -Id $p.Id -Force
          Remove-Item dist\config.json, dist\cert.pem, dist\key.pem, dist\ftx1-pult.log -ErrorAction SilentlyContinue
          if (-not $ping.StartsWith('FTX1') -or $panel -ne 200 -or $pult -ne 200) { exit 1 }
          if (Select-String -Path selftest.txt -Pattern 'FAIL' -Quiet) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: FTX1-Pult
          path: dist/FTX1-Pult.exe
      - name: Релиз «последняя сборка»
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: FTX-1 Пульт — последняя сборка
          body: |
            Скачайте **FTX1-Pult.exe**, положите в любую папку и запустите двойным кликом.
            Python не нужен. Настройки (config.json) и журнал появятся рядом с exe.
            Сборка: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          files: dist/FTX1-Pult.exe
